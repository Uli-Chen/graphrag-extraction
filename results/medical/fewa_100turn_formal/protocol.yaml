dataset: medical
designation: official_fewa_3seed
method: ts_pl_fewa
turns_per_seed: 100
random_seeds:
- 40
- 41
- 42
query_method: local
llm_model: DeepSeek-V4-Flash
disable_api_thinking: true
enable_graph_filter: false
shared_seed_response: seed_response.txt
initial_epsilon: 0.3
epsilon_decay: 0.98
min_epsilon: 0.05
htsn_threshold: 0.15
adaptive_htsn_threshold: true
fewa_delta: 0.05
fewa_max_arms: 3
reward_normalizer: 512
aggregation: mean_and_sample_standard_deviation
