[project]
name = "mematk"
version = "0.1.0"
description = "Topology-sensitive graph extraction and evaluation"
requires-python = ">=3.10,<3.11"
dependencies = [
    "graphrag",
    "openai",
    "python-dotenv",
    "networkx",
    "pandas",
    "pyyaml",
    "numpy",
]

[project.scripts]
mematk-extract = "extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction", "src/evaluation"]

[tool.uv]
package = true
